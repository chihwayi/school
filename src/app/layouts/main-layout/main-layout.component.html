<div class="main-layout">
  <app-sidebar 
    [isExpanded]="isSidebarExpanded" 
    (toggleSidebar)="toggleSidebar($event)">
  </app-sidebar>
  
  <div class="main-content-wrapper" [class.sidebar-expanded]="isSidebarExpanded">
    <app-header [class.sidebar-expanded]="isSidebarExpanded"></app-header>
    
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
    
    <app-footer></app-footer>
  </div>
</div>
