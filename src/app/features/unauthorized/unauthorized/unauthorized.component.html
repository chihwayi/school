<div class="unauthorized-container">
  <div class="unauthorized-card">
    <!-- Icon -->
    <div class="icon-container">
      <svg class="warning-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="title">Access Denied</h1>

    <!-- Message -->
    <div class="message">
      <p class="main-message">
        You don't have permission to access this page.
      </p>
      <p class="sub-message" *ngIf="username">
        Hello <strong>{{username}}</strong>, your current role(s): 
        <span class="roles">
          <span class="role-badge" *ngFor="let role of userRoles">
            {{role.replace('ROLE_', '')}}
          </span>
        </span>
      </p>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button 
        type="button" 
        class="btn btn-primary" 
        (click)="goToDashboard()">
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        Go to Dashboard
      </button>
      
      <button 
        type="button" 
        class="btn btn-secondary" 
        (click)="goBack()">
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Go Back
      </button>
    </div>

    <!-- Additional Help -->
    <div class="help-section">
      <p class="help-text">
        If you believe you should have access to this page, please contact your system administrator.
      </p>
      
      <button 
        type="button" 
        class="btn btn-link logout-btn" 
        (click)="logout()">
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Sign Out
      </button>
    </div>
  </div>
</div>
